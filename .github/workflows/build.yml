name: build-deb

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: XO release channel
        type: choice
        options: [stable, latest]
        default: stable
  schedule:
    - cron: '0 4 * * 1'

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.channel)) || fromJSON('["stable","latest"]') }}
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential python3 pkg-config \
            libfuse-dev libssl-dev dpkg-dev lintian
      - uses: actions/checkout@v4
      - run: make deb CHANNEL=${{ matrix.channel }}
      - name: Lint
        run: lintian out/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: xen-orchestra-deb-${{ matrix.channel }}
          path: out/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
